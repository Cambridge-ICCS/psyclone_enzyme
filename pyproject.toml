[build-system]
requires = ["setuptools"]

[project]
name = "psyclone_enzyme"
version = "0.1.0"
authors = [
  {name = "Joe Wallwork"},
]
maintainers = [
  {name = "Joe Wallwork"},
]
description = "Python utilities supporting using PSyclone and Enzyme."
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
  "psyclone",
  "enzyme",
  "python",
]
dependencies = ["fparser==0.2.4", "lit==18.1.8", "psyclone==3.3.1"]

[project.urls]
Repository = "https://github.com/Cambridge-ICCS/psyclone_enzyme"

[tool.setuptools.packages.find]
include = ["psyclone_enzyme*"]
