[build-system]
requires = ["setuptools"]

[project]
name = "psyclone_enzyme"
version = "0.1.0"
authors = [
  {name = "Joe Wallwork"},
]
maintainers = [
  {name = "Joe Wallwork"},
]
description = "Python utilities supporting using PSyclone and Enzyme."
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
  "psyclone",
  "enzyme",
  "python",
]
dependencies = ["psyclone==3.2.2", "fparser==0.2.1"]

[project.urls]
Repository = "https://github.com/Cambridge-ICCS/psyclone_enzyme"

[project.scripts]
gen_interface = "psyclone_enzyme.gen_interface:main_cli"

[tool.setuptools]
packages = ["psyclone_enzyme"]
